# Project and in/out paths, now specific for each sample because its more flexible
# enter all samples for the analysis here + append one entry per sample
# at the end (for paths and settings and such)
# SAMPLE IDs MAY END UP IN PATHS, SO PLEASE USE ONLY [a-zA-Z0-9-_.] IN THESE NAMES
samples: ["PM1", "PM2", "PM3", "PM4", "MM1", "MN1", "MN2", "PM5", "PM6", "PM7", "MM2", "MM3"]
# to avoid any processing of samples, just remove them from the list above
# samples in the list below get basic preprocessing but no in-depth analysis
rejected_samples: ["MM2", "MM3", "POZNIAK1", "POZNIAK2", "POZNIAK3"]

# samples from existing/external datasets
external_samples: ["POZNIAK1", "POZNIAK2", "POZNIAK3", "POZNIAK4", "POZNIAK5", "POZNIAK6"]

# collections of samples for various reasons
primary_melanoma_samples: ["PM1", "PM2", "PM3", "PM4", "PM5", "PM6", "PM7"]
# the samples with immune response are used for inflammatory border LRI in Grosse et al. 2026
highest_immune_response_melanoma_samples: ["PM1", "PM2", "PM3", "PM4"]
metastasis_samples: ["MM1", "MM2", "MM3"]
naevus_samples: ["MN1", "MN2"]

## only for HD data here
HD_data_ids_used: ["HD_PM1", "HD_PM2", "HD_PM3", "HD_PM4", "HD_MM1", "HD_MM2", "HD_MM3"]
HD_data_input_paths:
  HD_PM1: "<INPUTPATH>/tacco-annotate-OT-HD_PM1-hema-rotate.h5ad"
  HD_PM2: "<INPUTPATH>/tacco-annotate-OT-HD_PM2-hema-rotate.h5ad"
  HD_PM3: "<INPUTPATH>/tacco-annotate-OT-HD_PM3-hema-rotate.h5ad"
  HD_PM4: "<INPUTPATH>/tacco-annotate-OT-HD_PM4-hema-rotate.h5ad"
  HD_MM1: "<INPUTPATH>/tacco-annotate-OT-HD_MM1-hema-rotate.h5ad"
  HD_MM2: "<INPUTPATH>/tacco-annotate-OT-HD_MM2-hema-rotate.h5ad"
  HD_MM3: "<INPUTPATH>/tacco-annotate-OT-HD_MM3-hema-rotate.h5ad"
HD_border_region_dist_cutoff_mym: 50
HD_filter:
  min_counts: 40
  min_bins: 5
  max_bins: 150
  allowed_sources: ["primary"] # primary, secondary or both

# QC settings
QC_cutoffs:
  genes: 80
  counts: 100
  mito: 20
global_qc_resolutions: [0.3, 0.7, 1.1, 1.5]

# preprocessing settings
clustree_resolutions: [0.3, 0.5, 0.7, 0.9, 1.1]
pca_components_clustering_sct: 25

# LRI settings
Niches_result_used: "CTN"
Niches_normalization_used: "logcounts"

# output directories for reports
## the parent path is absolute, all other output paths are relative to it
results_directory_parent: "<RESULTSDIR>/2025-grosse-et-al/"
global_index_dir: "global_index/"

# intermediate data
## the parent path is absolute, all other intermediate file paths are relative to it
workdata_parent: "<INTERMEDIATEDIR>/2025-grosse-et-al/"
merge_and_integration_dir: "combined/"
HD_intermediates: "hd/"

single_cell_reference_dir: "<INPUTPATH>/Stubenvoll_2025_melanoma/"

#the sample that michael analyzed at first
PM1:
  full_name: "Primary_Melanoma_1"
  type: "SSM"
  crop_area: [0.25, 0.2, 0.8, 0.75]
  rotate: 90
  mirror_x: 0
  mirror_y: 0
  secondary_analysis: "<RAWDATA>/PM1_out/outs/"
  annotations: "./assets/annotations/PM1/"
  workdata:  "samples/PM1/"
  tertiary: "samples/PM1/"
  seurat_clustering_resolution: 0.5
  note: "Superficial spreading melanoma, Breslow thickness 2.8 mm"

